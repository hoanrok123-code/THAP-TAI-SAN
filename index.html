<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tháp Tài Sản">
<link rel="manifest" href="manifest.json">
<title>Tháp Tài Sản</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(145deg,#0f172a,#1e293b);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 18px 18px}
.headerrow{display:flex;justify-content:space-between;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:#ffffff1f;display:grid;place-items:center;font-size:18px}
.eyebrow{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.title{font-size:20px;font-weight:800;margin-top:1px}
.wrap{max-width:720px;margin:auto;padding:10px 10px calc(80px + env(safe-area-inset-bottom))}

.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px #0f172a08}
.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.hero .small{color:#94a3b8}
.small{font-size:11px}.muted{color:#64748b}.bold{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:#f8fafc;border-radius:10px;padding:8px 10px}
.metric .v{font-size:15px;font-weight:800;margin-top:2px}
.metric.dark{background:#ffffff14}.metric.dark .v{color:#fff}
.label{font-size:11px;color:#64748b}.hero .label{color:#94a3b8}

h1,h2,h3,p{margin:0 0 6px}
h2{font-size:17px;font-weight:800}
h3{font-size:14px;font-weight:700}

.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px;background:#0f172a;color:#fff;cursor:pointer}
button.secondary{background:#e2e8f0;color:#0f172a}
button.danger{background:#fef2f2;color:#991b1b}
.small-btn{padding:4px 8px;font-size:11px;border-radius:6px}

input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;margin-bottom:8px}
label{display:block;font-size:11px;color:#475569;margin:6px 0 3px;font-weight:600}

.eval-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eval-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center}
.eval-title{font-size:11px;color:#64748b;font-weight:600}
.eval-val{font-size:18px;font-weight:900;margin:4px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:800}
.badge-good{background:#dcfce7;color:#15803d}
.badge-warn{background:#fef3c7;color:#b45309}
.badge-bad{background:#fee2e2;color:#b91c1c}

.tower-analysis{display:flex;flex-direction:column;gap:8px}
.tower-row{border-bottom:1px solid #f1f5f9;padding-bottom:6px}
.tower-row-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.layer-title{font-weight:700}.layer-stat{font-size:11px}
.bar{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.good{background:#22c55e}.bar i.warn{background:#f59e0b}.bar i.bad{background:#ef4444}
.row-sub{display:flex;justify-content:space-between;font-size:10px}
.text-good{color:#16a34a;font-weight:700}.text-warn{color:#d97706;font-weight:700}.text-bad{color:#dc2626;font-weight:700}

.asset-list{display:flex;flex-direction:column;gap:4px}
.item-compact{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #e2e8f0}
.item-compact:last-child{border-bottom:0}
.item-info{display:flex;flex-direction:column;font-size:12px}
.item-actions{display:flex;gap:4px}

.asset-checkbox-list{max-height:160px;overflow-y:auto;border:1px solid #cbd5e1;border-radius:8px;padding:8px;background:#f8fafc}
.checkbox-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px}

canvas{width:100%;height:180px}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{flex:1}

nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#ffffffea;backdrop-filter:blur(12px);border-top:1px solid #e2e8f0;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;color:#64748b;padding:6px 2px;flex:1;font-size:11px;font-weight:600}
nav button.active{color:#0f172a;font-weight:800}
hr{border:0;border-top:1px solid #e2e8f0;margin:10px 0}
</style>
</head>
<body>
<header>
  <div class="headerrow">
    <div>
      <div class="eyebrow">PERSONAL FINANCE</div>
      <div class="title">Tháp Tài Sản</div>
    </div>
    <div class="logo">△</div>
  </div>
</header>
<main id="app" class="wrap"></main>
<nav id="nav"></nav>
<script src="app.js"></script>
</body>
</html>
