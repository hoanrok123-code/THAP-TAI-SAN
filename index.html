<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Tháp Tài Sản">
<link rel="manifest" href="manifest.json"><title>Tháp Tài Sản</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
header{background:linear-gradient(145deg,#0b1220,#1e293b);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 24px 24px}
.headerrow{display:flex;justify-content:space-between;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:#fff2;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:1px}.title{font-size:24px;font-weight:800;margin-top:2px}.wrap{max-width:760px;margin:auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:19px;padding:16px;margin-bottom:12px;box-shadow:0 5px 20px #0f172a0a}.hero{background:linear-gradient(135deg,#111827,#334155);color:#fff}.hero .small{color:#cbd5e1}.small{font-size:12px;color:#667085}.muted{color:#667085}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f8fa;border-radius:15px;padding:13px}.metric .v{font-size:20px;font-weight:800;margin-top:4px}.metric.dark{background:#ffffff18}.metric.dark .v{color:#fff}.label{font-size:12px;color:#667085}.hero .label{color:#cbd5e1}
h1,h2,h3,p{margin:0 0 8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#111827;color:#fff}button.secondary{background:#eef1f5;color:#111827}button.danger{background:#fee2e2;color:#991b1b}
input,select{width:100%;border:1px solid #d7dce2;border-radius:11px;padding:11px 12px;font:inherit;background:#fff}label{display:block;font-size:12px;color:#667085;margin:10px 0 5px}
.item{border:1px solid #e7e9ed;border-radius:14px;padding:12px;margin-top:8px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.tag{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef2ff}.good{color:#15803d}.bad{color:#b42318}.warn{color:#b54708}
.bar{height:9px;background:#e8ebef;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111827;border-radius:99px}.tower{display:flex;flex-direction:column-reverse;gap:6px}.layer{padding:13px;border-radius:13px;background:#eef0f3}.layer strong{display:block;margin-top:4px}.layer.top{background:#111827;color:#fff}
canvas{width:100%;height:210px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(16px);border-top:1px solid #e6e8eb;display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{background:none;color:#667085;padding:8px 2px;flex:1;font-size:11px}nav button.active{color:#111827}
hr{border:0;border-top:1px solid #eee;margin:14px 0}
</style></head><body><header><div class="headerrow"><div><div class="eyebrow">PERSONAL FINANCE</div><div class="title">Tháp Tài Sản</div><div style="font-size:12px;opacity:.7">Tài sản • Dòng tiền • Nợ • Mục tiêu</div></div><div class="logo">△</div></div></header><main id="app" class="wrap"></main><nav id="nav"></nav><script src="app.js"></script></body></html>
